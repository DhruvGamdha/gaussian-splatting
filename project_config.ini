# ==============================================================================
# Unified Project Configuration - Gaussian Splatting
# ==============================================================================
# This configuration file contains all parameters for the entire project
# All scripts can read from this file to get their required parameters
#
# Format: SECTION.PARAMETER = VALUE
# Use forward slashes (/) for paths - they work on both Windows and Linux
# Paths are relative to project root directory

[project]
# Main project settings
name = gaussian_splatting
version = 1.0
author = dgamdha

[paths]
# Base data paths (relative to project root)
data_dir = data
output_dir = output
temp_dir = temp

# Current project paths
current_project = 2025_jan_14/customFrames/vid_2
equirect_subdir = rawFrames/1_equirect
cubemap_subdir = rawFrames/2_cubemap
combined_subdir = rawFrames/4_cubemap_combined

# Training dataset selection (choose which dataset to train on)
train_subdir = rawFrames/4_cubemap_combined

[video_processing]
# Video extraction parameters
skip_frames = 10
output_format = jpg
video_quality = 95

# Video input (video file should be in current_project directory)
video_name = 1_VID_20241024_192309_00_028.mp4

[cubemap]
# Cubemap conversion parameters
face_size = 512
face_names = posx,negx,posy,negy,posz,negz

# Cubemap combination parameters
start_idx = 20
end_idx = 100
num_intermediate = 3
vfov = 90
out_size = 512

# Cubemap direction entries (replaces combcube_multi_config.cfg)
# Format: direction_view = path
# Use forward/backward to indicate frame ordering direction
forward_posz = data/2025_jan_14/customFrames/vid_2/rawFrames/2_cubemap/posz/input
backward_posx = data/2025_jan_14/customFrames/vid_2/rawFrames/2_cubemap/posx/input
forward_negz = data/2025_jan_14/customFrames/vid_2/rawFrames/2_cubemap/negz/input
backward_negx = data/2025_jan_14/customFrames/vid_2/rawFrames/2_cubemap/negx/input

[gaussian_splatting]
# Training parameters
iterations = 30000
position_lr_init = 0.00016
position_lr_final = 0.0000016
feature_lr = 0.0025
opacity_lr = 0.025
scaling_lr = 0.005
rotation_lr = 0.001

# Densification parameters
percent_dense = 0.01
densification_interval = 100
opacity_reset_interval = 3000
densify_from_iter = 500
densify_until_iter = 15000
densify_grad_threshold = 0.0002

# Loss parameters
lambda_dssim = 0.2

# Output settings
save_iterations = 7000,30000
checkpoint_iterations = 7000,30000
test_iterations = 7000,30000

[colmap]
# COLMAP processing parameters
camera_model = PINHOLE
feature_extractor_gpu = true
matcher_gpu = true
dense_reconstruction = true

[platform]
# Platform-specific settings
windows_python = python
linux_python = python3
max_threads = 8
memory_limit = 16GB

[examples]
# Example configurations for different projects
# Uncomment and modify as needed

# Example 1: OneDrive project
# current_project = onedrive_2023_12_13/type1
# equirect_subdir = original  
# cubemap_subdir = cubemap
# combined_subdir = cubemap_combined/ver1
# train_subdir = cubemap_combined/ver1  # Train on combined dataset

# Example 2: Simple project structure
# current_project = my_project
# equirect_subdir = input
# cubemap_subdir = cubemap
# combined_subdir = output
# train_subdir = output  # Train on processed output

# Example 3: Training on different datasets
# train_subdir = rawFrames/1_equirect     # Train on original 360° images
# train_subdir = rawFrames/2_cubemap      # Train on cubemap faces
# train_subdir = rawFrames/4_cubemap_combined  # Train on combined dataset
