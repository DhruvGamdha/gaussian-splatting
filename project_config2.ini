# ==============================================================================
# Test Project Configuration - Gaussian Splatting Project 2
# ==============================================================================

[project]
name = gaussian_splatting_project2
version = 1.0
author = dgamdha

[paths]
data_dir = data
output_dir = output
temp_dir = temp
current_project = 2025_jan_14/test_project2
equirect_subdir = rawFrames/1_equirect
cubemap_subdir = rawFrames/2_cubemap
combined_subdir = rawFrames/4_cubemap_combined

# Training dataset selection (choose which dataset to train on)
train_subdir = rawFrames/2_cubemap

[video_processing]
skip_frames = 5
output_format = jpg
video_quality = 90
video_name = test_video.mp4

[cubemap]
face_size = 256
face_names = posx,negx,posy,negy,posz,negz
start_idx = 10
end_idx = 50
num_intermediate = 2
vfov = 80
out_size = 256
forward_posz = data/2025_jan_14/test_project2/rawFrames/2_cubemap/posz
backward_negz = data/2025_jan_14/test_project2/rawFrames/2_cubemap/negz

[gaussian_splatting]
iterations = 15000
position_lr_init = 0.0002
position_lr_final = 0.000002
feature_lr = 0.003
opacity_lr = 0.03
scaling_lr = 0.006
rotation_lr = 0.002

# Densification parameters (different from project 1)
percent_dense = 0.02
densification_interval = 150
opacity_reset_interval = 2500
densify_from_iter = 400
densify_until_iter = 12000
densify_grad_threshold = 0.0003

# Loss parameters
lambda_dssim = 0.15

save_iterations = 5000,15000
checkpoint_iterations = 5000,15000
test_iterations = 5000,15000

[colmap]
camera_model = SIMPLE_PINHOLE
feature_extractor_gpu = false
matcher_gpu = false
dense_reconstruction = false

[platform]
windows_python = python
linux_python = python3
max_threads = 4
memory_limit = 8GB
