# ==============================================================================
# Test Project Configuration - Gaussian Splatting Project 2
# ==============================================================================
# Organized by workflow: Video → Cubemap → COLMAP → Training
# Use forward slashes (/) for paths - they work on both Windows and Linux
# Paths are relative to project root directory

[project]
# Main project settings
name = gaussian_splatting_project2
version = 1.0
author = dgamdha

# ==============================================================================
# STEP 1: VIDEO EXTRACTION & CUBEMAP CONVERSION (get360frames.py)
# ==============================================================================

[paths]
# Base directories (relative to project root)
data_dir = data
output_dir = output
temp_dir = temp

# Current project working directory
current_project = 2025_jan_14/test_project2

# Base subdirectory for all raw frames (within current_project)
rawframes_base = rawFrames

[video_processing]
# Video input - located in: {data_dir}/{current_project}/{video_name}
video_name = test_video.mp4

# Frame extraction settings
# Extract 1 frame every N frames
skip_frames = 5
# Output image format
output_format = jpg
# JPEG quality (1-100)
video_quality = 90

# Output directories (relative to rawframes_base)
# Equirectangular frames output directory
equirect_subdir = 1_equirect
# Cubemap faces output directory
cubemap_subdir = 2_cubemap

[cubemap]
# Cubemap conversion parameters for get360frames.py
# Resolution of each cubemap face in pixels
face_size = 256
# The 6 cube faces to generate
face_names = posx,negx,posy,negy,posz,negz

# ==============================================================================
# STEP 2: CUBEMAP COMBINATION (combinecubemap_multiple_intermediates.py)
# ==============================================================================

[cubemap_combination]
# Frame range to process
# Start frame index
start_idx = 10
# End frame index
end_idx = 50
# Number of intermediate frames to generate between keyframes
num_intermediate = 2

# Perspective generation parameters
# Vertical field of view in degrees
vfov = 80
# Output image size in pixels
out_size = 256

# Output directory for combined cubemap perspectives (relative to rawframes_base)
combined_subdir = 4_cubemap_combined

# Cubemap direction entries (replaces combcube_multi_config.cfg)
# Format: direction_view = face_name
# Use forward/backward to indicate frame ordering direction
# The full path will be constructed automatically from cubemap_subdir
forward_posz = posz
backward_negz = negz

# ==============================================================================
# STEP 3: COLMAP PREPROCESSING (convert.py)
# ==============================================================================

[colmap]
# COLMAP processing parameters
# Camera model: OPENCV, PINHOLE, RADIAL, SIMPLE_RADIAL, etc.
camera_model = SIMPLE_PINHOLE
# Use GPU for SIFT feature extraction
feature_extractor_gpu = false
# Use GPU for feature matching
matcher_gpu = false
# Perform dense reconstruction (stereo matching)
dense_reconstruction = false

# ==============================================================================
# STEP 4: GAUSSIAN SPLATTING TRAINING (train.py)
# ==============================================================================

[training]
# Dataset selection (relative to rawframes_base) - used for both COLMAP preprocessing (convert.py) and training (train.py)
# Choose which dataset to process and train on:
#   1_equirect          - original 360° equirectangular images
#   2_cubemap           - cubemap faces
#   4_cubemap_combined  - combined perspective views
train_subdir = 2_cubemap

[gaussian_splatting]
# Training parameters
# Total number of training iterations
iterations = 15000

# Learning rates
# Initial learning rate for gaussian positions
position_lr_init = 0.0002
# Final learning rate for gaussian positions
position_lr_final = 0.000002
# Learning rate for spherical harmonic features
feature_lr = 0.003
# Learning rate for opacity
opacity_lr = 0.03
# Learning rate for scaling
scaling_lr = 0.006
# Learning rate for rotation
rotation_lr = 0.002

# Densification control
# Percentage of scene extent to consider for densification
percent_dense = 0.02
# Perform densification every N iterations
densification_interval = 150
# Reset opacity to initial value every N iterations
opacity_reset_interval = 2500
# Start densification at this iteration
densify_from_iter = 400
# Stop densification at this iteration
densify_until_iter = 12000
# Gradient threshold for densification (split/clone gaussians)
densify_grad_threshold = 0.0003

# Loss function parameters
# Weight for DSSIM (structural similarity) loss component
lambda_dssim = 0.15

# Checkpointing and evaluation
# Save full model at these iterations (comma-separated)
save_iterations = 5000,15000
# Save training checkpoints at these iterations (comma-separated)
checkpoint_iterations = 5000,15000
# Run evaluation on test set at these iterations (comma-separated)
test_iterations = 5000,15000

# ==============================================================================
# PLATFORM SETTINGS
# ==============================================================================

[platform]
# Platform-specific settings
# Python executable on Windows
windows_python = python
# Python executable on Linux/Unix
linux_python = python3
# Maximum number of threads to use
max_threads = 4
# Memory limit for processing
memory_limit = 8GB